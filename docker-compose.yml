version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nexus-pi-db
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_pi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.12.0
    container_name: nexus-pi-neo4j
    environment:
      NEO4J_AUTH: neo4j/nexus_neo4j_password
      # Accept enterprise license if using enterprise edition, but community is fine for now
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
